<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Линия контакта — Круг друзей</title><link rel="stylesheet" href="./style.css?v=5"></head>
<body><main>
<header><a href="../">‹ Все игры</a><span id="status" role="status"></span></header>
<h1>Линия контакта</h1>
<section id="entry" class="panel">
<p>Командная арена с видом сверху для 2–8 игроков. Матч до четырёх победных раундов.</p>
<label>Имя <input id="name" maxlength="20" placeholder="Игрок"></label>
<div class="solo-entry">
<label>Карта для игры с ботом <select id="solo-map"></select></label>
<button id="solo" disabled>Играть одному</button>
</div>
<button id="create" disabled>Создать комнату</button>
<form id="join"><label>Код комнаты <input id="code" maxlength="6" required autocomplete="off"></label><button id="join-button" disabled>Войти</button></form>
</section>
<section id="room" hidden>
<div class="bar panel"><div id="room-label">Комната <strong id="room-code"></strong></div><strong id="solo-label" hidden>Игра с ботом</strong><button id="copy">Пригласить</button><button id="leave">Выйти</button></div>
<div id="lobby" class="panel">
<label>Арена <select id="map"></select></label><p id="players"></p><button id="start">Начать матч</button>
</div>
<div id="match" hidden>
<div class="bar scoreboard"><strong id="score"></strong><span id="round"></span><strong id="timer"></strong></div>
<div class="field"><canvas id="field" width="960" height="640" aria-label="Игровая арена"></canvas>
<section id="buy" class="panel shop" hidden><h2>Закупка</h2><p id="credits"></p><div id="shop"></div></section>
<div id="result" class="panel result" hidden><strong id="result-text"></strong><button id="again" hidden>Сыграть ещё</button></div></div>
<div class="bar info"><strong id="hp"></strong><span class="keyboard-help">WASD или стрелки · движение　 Мышь · прицел　 ЛКМ · стрелять</span></div>
<div id="touch-controls"><div id="joystick" aria-label="Движение"><span id="stick"></span></div><p>Джойстик — движение.<br>Коснись арены и удерживай, чтобы стрелять.</p></div>
</div>
</section>
</main><script src="../config.js"></script><script type="module" src="./app.js?v=5"></script></body>
</html>
